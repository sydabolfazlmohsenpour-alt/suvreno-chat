<!-- بخش «تفاوت کیفیت» + «تجربه‌ی کاربران» برای وب‌سایت suvreno.ir
     کل این فایل را (از <section> تا </script>) هر جای index.html سایت که می‌خواهی بگذار.
     داده‌ها زنده از Worker پلاس می‌آیند؛ نمونه‌ها و نظرها را از پنل ادمین (تب «نظرات و مقایسه») مدیریت کن. -->
<section id="svProof" dir="rtl" style="max-width:920px;margin:48px auto;padding:0 16px;font-family:inherit;color:inherit">
<style>
#svProof h2{margin:0 0 6px;font-size:1.5rem}#svProof .sp-sub{opacity:.75;margin:0 0 16px;line-height:1.9}
#svProof .sp-tabs,#svProof .sp-cats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#svProof button{border:0;border-radius:12px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:rgba(127,127,127,.35)}
#svProof button.on,#svProof .sp-cta{background:linear-gradient(135deg,#2de2c8,#2d8cff)}#svProof .sp-cta{display:inline-block;margin-top:14px;color:#04141a;text-decoration:none;border-radius:12px;padding:11px 20px;font-weight:800}
#svProof .sp-box{position:relative;direction:ltr;border-radius:16px;overflow:hidden;background:#000;margin-top:10px;user-select:none}
#svProof .sp-box img{display:block;width:100%;height:auto}#svProof .sp-top{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#svProof .sp-lb{position:absolute;top:10px;padding:3px 11px;border-radius:10px;background:rgba(0,0,0,.65);color:#fff;font-weight:700;font-size:.8rem}
#svProof .sp-box input{position:absolute;left:4%;right:4%;width:92%;bottom:10px}
#svProof .sp-orig{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:.85rem}#svProof .sp-orig img{width:70px;height:70px;object-fit:cover;border-radius:10px}
#svProof .sp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
#svProof .sp-card{padding:14px;border-radius:16px;background:rgba(127,127,127,.14);border:1px solid rgba(127,127,127,.3);line-height:1.9}#svProof .sp-card b{display:block;margin-top:6px;opacity:.85}
</style>
<div id="spCmp" style="display:none">
  <h2>تفاوت کیفیت را با چشم خودت ببین</h2>
  <p class="sp-sub">هر دو تصویر با «دقیقاً یک پرامپت» ساخته شده‌اند؛ فقط مدل فرق دارد. نوار را بکش.</p>
  <div class="sp-tabs" id="spKinds"></div><div class="sp-cats" id="spCats"></div><div class="sp-cats" id="spItems"></div><div id="spView"></div>
  <a class="sp-cta" href="https://chat.suvreno.ir/?upgrade=1">تجربه‌ی کیفیت بالاتر با Suvreno Plus</a>
</div>
<div id="spVoices" style="display:none;margin-top:44px">
  <h2>تجربه‌ی کاربران Suvreno</h2><p class="sp-sub" id="spAvg"></p><div class="sp-grid" id="spGrid"></div>
</div>
<script>
(function () {
  var URL_ = "https://suvreno-plus.sydabolfazlmohsenpour.workers.dev/", $ = function (i) { return document.getElementById(i); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function call(b) { return fetch(URL_, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }).then(function (r) { return r.json(); }); }
  var list = [], kind = "gen", cat = "", sel = "", cache = {};
  function img(id, side) { var k = id + side; if (cache[k]) return Promise.resolve(cache[k]); return call({ mode: "plus-compare-image", id: id, side: side }).then(function (r) { if (r && r.ok) cache[k] = r.image; return cache[k] || ""; }).catch(function () { return ""; }); }
  function draw() {
    var kinds = ["gen", "edit"].filter(function (k) { return list.some(function (i) { return i.kind === k; }); });
    if (kinds.indexOf(kind) < 0) kind = kinds[0];
    var ofk = list.filter(function (i) { return i.kind === kind; }), cats = []; ofk.forEach(function (i) { if (i.cat && cats.indexOf(i.cat) < 0) cats.push(i.cat); });
    var items = ofk.filter(function (i) { return !cat || i.cat === cat; }); if (!items.some(function (i) { return i.id === sel; })) sel = items[0] ? items[0].id : "";
    $("spKinds").innerHTML = kinds.map(function (k) { return '<button data-k="' + k + '" class="' + (k === kind ? "on" : "") + '">' + (k === "gen" ? "ساخت تصویر" : "ویرایش تصویر") + "</button>"; }).join("");
    $("spCats").innerHTML = cats.map(function (c) { return '<button data-c="' + esc(c) + '" class="' + (c === cat ? "on" : "") + '">' + esc(c) + "</button>"; }).join("");
    $("spItems").innerHTML = items.map(function (i, n) { return '<button data-i="' + esc(i.id) + '" class="' + (i.id === sel ? "on" : "") + '">' + esc(i.title || n + 1) + "</button>"; }).join("");
    var cur = items.filter(function (i) { return i.id === sel; })[0], v = $("spView"); if (!cur) { v.innerHTML = ""; return; }
    v.innerHTML = "…"; var want = cur.id;
    Promise.all([img(cur.id, "free"), img(cur.id, "plus"), cur.hasOrig ? img(cur.id, "orig") : Promise.resolve("")]).then(function (a) {
      if (sel !== want) return; if (!a[0] || !a[1]) { v.innerHTML = ""; return; }
      v.innerHTML = (a[2] ? '<div class="sp-orig"><img src="' + a[2] + '" alt=""><span>عکس اصلیِ آپلودشده</span></div>' : "") + '<div class="sp-box"><img src="' + a[0] + '" alt="Free"><img class="sp-top" src="' + a[1] + '" alt="Plus" style="clip-path:inset(0 0 0 50%)"><span class="sp-lb" style="left:10px">رایگان</span><span class="sp-lb" style="right:10px">Plus</span><input type="range" min="0" max="100" value="50"></div>' + (cur.prompt ? '<p class="sp-sub">پرامپت: ' + esc(cur.prompt) + "</p>" : "");
      var rg = v.querySelector("input"), top = v.querySelector(".sp-top"); rg.addEventListener("input", function () { top.style.clipPath = "inset(0 0 0 " + rg.value + "%)"; });
    });
  }
  $("spCmp").addEventListener("click", function (e) { var b = e.target.closest ? e.target.closest("button") : null; if (!b) return; if (b.dataset.k) { kind = b.dataset.k; cat = ""; sel = ""; } else if (b.dataset.c !== undefined) { cat = cat === b.dataset.c ? "" : b.dataset.c; sel = ""; } else if (b.dataset.i) sel = b.dataset.i; draw(); });
  call({ mode: "plus-compare-list" }).then(function (r) { if (r && r.ok && r.items.length) { list = r.items; $("spCmp").style.display = "block"; draw(); } }).catch(function () { });
  call({ mode: "plus-testimonials" }).then(function (r) {
    if (!r || !r.ok || !r.items.length) return;
    $("spVoices").style.display = "block"; if (r.avg) $("spAvg").textContent = "میانگین امتیاز " + r.avg.toLocaleString("fa-IR") + " از ۵ (" + r.count.toLocaleString("fa-IR") + " نظر)";
    $("spGrid").innerHTML = r.items.map(function (i) { return '<div class="sp-card">' + (i.rating ? "⭐".repeat(i.rating) + "<br>" : "") + esc(i.text) + "<b>— " + esc(i.name) + "</b></div>"; }).join("");
  }).catch(function () { });
})();
</script>
</section>
